    const tl = gsap.timeline({ paused: true });

    function typeLine(sel, text, start, perChar) {
      const el = document.querySelector(sel);
      const o = { i: 0 };
      el.textContent = "";
      tl.to(
        o,
        {
          i: text.length,
          duration: Math.max(0.12, perChar * text.length),
          ease: "none",
          onUpdate: () => {
            el.textContent = text.slice(0, Math.round(o.i));
          },
        },
        start,
      );
    }

    tl.fromTo("#s4c-term", { opacity: 0 }, { opacity: 1, duration: 0.24 }, 0);
    tl.fromTo(
      ["#s4c-h1", "#s4c-h2", "#s4c-h3"],
      { opacity: 0.55 },
      { opacity: 0.55, duration: 0.01 },
      0,

    typeLine("#s4c-t2", "/mnt/tfreader /dev/nbd0p1 vfat rw,uid=1000,gid=1000", 0.62, 0.012);
    typeLine("#s4c-t3", "$ ls /mnt/tfreader", 1.55, 0.03);
    typeLine("#s4c-t4", "TFR_CODE", 2.1, 0.06);

      { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },

    tl.to("#s4c-link-cap", { opacity: 0, duration: 0.14 }, 2.2);

      { opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power4.out" },
      2.35,

    // out to the folder the PC now sees
