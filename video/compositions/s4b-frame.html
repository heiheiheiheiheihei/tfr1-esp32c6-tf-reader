    const tl = gsap.timeline({ paused: true });

    function typeLine(sel, text, start, perChar) {
      const el = document.querySelector(sel);
      const o = { i: 0 };
      el.textContent = "";
      tl.to(
        o,
        {
          i: text.length,
          duration: Math.max(0.12, perChar * text.length),
          ease: "none",
          onUpdate: () => {
            el.textContent = text.slice(0, Math.round(o.i));
          },
        },
        start,
      );
    }

    tl.fromTo(
      "#s4b-head",
      { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out" },

    tl.fromTo("#s4b-note", { opacity: 0 }, { opacity: 1, duration: 0.26 }, 0.3);

    const boxes = [
      "#s4b-b1",
      "#s4b-b2",
      "#s4b-b3",
      "#s4b-b4",
      "#s4b-b5",
      "#s4b-b6",
      "#s4b-b7",
    ];
    boxes.forEach((sel, i) => {
      tl.fromTo(
        sel,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" },
        0.32 + i * 0.075,
      );
    });
    tl.fromTo(
      "#s4b-payload",
      { opacity: 0, scale: 0.4 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" },
      1.3,
    );

    tl.to("#s4b-note", { opacity: 0, duration: 0.18 }, 1.98);
    tl.to(
      "#s4b-frame",
      { scale: 0.42, x: 420, opacity: 0, duration: 0.5, ease: "power3.in" },
      2.0,
    );
    tl.to("#s4b-flood", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 2.1);

    tl.fromTo(
      "#s4b-term",
      { opacity: 0, y: 26 },
