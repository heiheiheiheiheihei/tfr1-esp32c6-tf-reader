  <div id="root" data-composition-id="s4d" data-width="1920" data-height="1080">
    <div class="bg"></div>

    <div id="s4d-stage">
      <div id="s4d-term" class="clip" data-start="0" data-duration="3.6">
        <div id="s4d-term-top"></div>
        <div class="s4d-ln dim" id="s4d-h1">$ ./scripts/mount.sh</div>
        <div class="s4d-ln dim" id="s4d-h2">/mnt/tfreader /dev/nbd0p1 vfat rw,uid=1000,gid=1000</div>
        <div class="s4d-ln dim" id="s4d-h3">$ ls /mnt/tfreader</div>

          4.00 MiB / 19.20 s · 16 KiB 一帧<br />USB Serial/JTAG · 12 Mbps
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    function typeLine(sel, text, start, perChar) {
      const el = document.querySelector(sel);
      const o = { i: 0 };
      el.textContent = "";
      tl.to(
        o,
        {
          i: text.length,
          duration: Math.max(0.1, perChar * text.length),
          ease: "none",
          onUpdate: () => {
            el.textContent = text.slice(0, Math.round(o.i));
          },
        },
        start,
      );
    }

    tl.fromTo("#s4d-term", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
    typeLine("#s4d-t1", "$ python3 host/tfreader_host.py --bench 4", 0.15, 0.026);
    typeLine("#s4d-t2", "  1.0 MiB", 0.75, 0.02);
    typeLine("#s4d-t3", "  2.0 MiB", 1.15, 0.02);
    typeLine("#s4d-t4", "  3.0 MiB", 1.55, 0.02);
    typeLine("#s4d-t5", "  4.0 MiB", 1.95, 0.02);
    typeLine("#s4d-t6", "read 4.00 MiB in 19.20s = 0.21 MiB/s", 2.4, 0.012);

    // the number lands on the photo
    tl.to("#s4d-term", { opacity: 0, duration: 0.18 }, 3.32);
    tl.to("#s4d-photo", { opacity: 1, duration: 0.1 }, 3.5);
    tl.fromTo(
      "#s4d-photo-img",
      { scale: 1.1 },
      { scale: 1.02, duration: 3.5, ease: "power2.out" },
      3.5,
    );
    const num = { v: 0 };
    tl.fromTo(
      num,
      { v: 0 },
      {
        v: 0.21,
        duration: 0.7,
        ease: "power2.out",
        onUpdate: () => {
          document.getElementById("s4d-big").textContent = num.v.toFixed(2);
        },
      },
      3.55,
    );
    tl.fromTo(
      "#s4d-big",
      { y: 26, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
      3.55,
    );
    tl.fromTo("#s4d-unit", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.0);
    tl.fromTo(
      "#s4d-cap",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power4.out" },
      4.3,
    );
    tl.fromTo("#s4d-note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.7);

    window.__timelines["s4d"] = tl;
  </script>
